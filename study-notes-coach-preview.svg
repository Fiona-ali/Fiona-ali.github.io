  <text x="84" y="322" fill="#00ffe7" font-family="Arial, sans-serif" font-size="28" font-weight="700">SOURCE-GROUNDED STUDY ASSISTANT</text>
  <text x="84" y="374" fill="#8aa6c3" font-family="Arial, sans-serif" font-size="22">Answers from course notes, with citations and a check before filling gaps.</text>

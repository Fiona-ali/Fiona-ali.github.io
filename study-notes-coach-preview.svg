<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Study Notes Coach — Shaik Fiona Ali</title>
  <desc id="desc">A case study of a private study assistant designed to answer from course notes and cite its sources.</desc>

  <rect x="394" y="438" width="300" height="54" rx="4" fill="#0b1825" stroke="#9b5cff" stroke-width="2"/><text x="418" y="473" fill="#d4e5f7" font-family="monospace" font-size="17" font-weight="700">MISSING-SOURCE GUARD</text>
  <rect x="714" y="438" width="224" height="54" rx="4" fill="#0b1825" stroke="#ff2d78" stroke-width="2"/><text x="740" y="473" fill="#d4e5f7" font-family="monospace" font-size="17" font-weight="700">3 OBSERVED RUNS</text>
